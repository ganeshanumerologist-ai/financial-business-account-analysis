services:
  - type: web
    name: arthivio
    runtime: docker
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: arthivio-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ARTHIVIO_HOST
        value: 0.0.0.0
      - key: ARTHIVIO_DB
        value: /var/data/arthivio.db
      - key: ARTHIVIO_BACKUP_DIR
        value: /var/data/backups
      - key: ARTHIVIO_DEMO_AUTOLOGIN
        value: "0"
      # Real deployment: no synthetic demo books. The first visit shows /setup.
      - key: ARTHIVIO_SEED_DEMO
        value: "0"
      # Allow the first owner to be created over the public URL. Once the owner
      # exists, /setup redirects to /login and this flag has no further effect.
      - key: ARTHIVIO_ALLOW_REMOTE_SETUP
        value: "1"
